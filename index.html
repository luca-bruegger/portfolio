<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070709">
    <meta name="author" content="Luca Brügger">
    <meta name="description" content="Luca Brügger — Software Developer aus dem Berner Oberland.">
    <link rel="canonical" href="https://lucabruegger.ch/">
    <title>Luca Brügger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="bg" aria-hidden="true">
        <video id="bgvid" class="bgvid is-on" autoplay muted loop playsinline poster="images/me_old.png"></video>
        <div class="wash"></div>
        <div class="grain"></div>
    </div>

    <header class="top">
        <span>Berner Oberland</span>
        <nav>
            <a href="https://www.github.com/luca-bruegger" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="mailto:hello@lucabruegger.ch">Mail</a>
            <a href="https://www.instagram.com/lucabruegger1" target="_blank" rel="noopener noreferrer">Instagram</a>
        </nav>
    </header>

    <main>
        <img class="portrait" src="images/me_old.png" alt="Luca Brügger">
        <p class="role">Software Developer</p>
        <h1>Luca<br>Brügger</h1>
        <p class="lede">Ich schreibe Software, die sich ruhig anfühlt. Kaffee, die Berge, und zu viele Livestreams von Raketen.</p>
    </main>

    <footer>
        <p><span id="copyright">&copy; 2018–2026 Luca Brügger</span> · <a href="imprint.html">Imprint</a> · <a href="https://www.b-projects.ch" target="_blank" rel="noopener noreferrer">b-projects</a></p>
    </footer>

    
    <script>
        (function () {
            var hour = Number(new Intl.DateTimeFormat("de-CH", {
                hour: "numeric", hourCycle: "h23", timeZone: "Europe/Zurich"
            }).format(new Date()));
            var file = "images/bg-night.mp4";
            if (hour >= 5 && hour < 10) file = "images/bg-morning.mp4";
            else if (hour >= 10 && hour < 17) file = "images/bg-day.mp4";
            else if (hour >= 17 && hour < 21) file = "images/bg-evening.mp4";
            var video = document.getElementById("bgvid");
            video.src = file;
            video.play().catch(function () {});
        })();
    </script>

    <script src="js/bg.js"></script>
    <script>
        document.getElementById("copyright").textContent =
            "\u00a9 2018\u2013" + new Date().getFullYear() + " Luca Br\u00fcgger";
    </script>
</body>
</html>
